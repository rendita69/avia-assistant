name: Build AIVA Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'
      - name: Build Debug APK
        working-directory: AIVA_Voice_Assistant_Android/AIVA_Voice_Assistant
        run: gradle assembleDebug --no-daemon
      - name: Upload AIVA APK
        uses: actions/upload-artifact@v4
        with:
          name: AIVA-Voice-Assistant-APK
          path: AIVA_Voice_Assistant_Android/AIVA_Voice_Assistant/app/build/outputs/apk/debug/app-debug.apk
